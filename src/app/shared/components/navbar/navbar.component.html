<header class="sticky top-0 z-40 border-b border-slate-200 bg-white/95 backdrop-blur">
  <div class="mx-auto flex max-w-7xl items-center justify-between gap-3 px-4 py-2.5 sm:px-6">
    <a routerLink="/feed" class="flex items-center gap-2.5 group">
      <div class="flex h-8 w-11 items-center justify-center rounded-xl bg-[#00298d] text-[11px] font-black uppercase tracking-wider text-white shadow-xs">
        ROUTE
      </div>
      <span class="text-lg sm:text-xl font-extrabold tracking-tight text-slate-900">
        Route Posts
      </span>
    </a>

    <nav class="flex items-center gap-1 rounded-2xl border border-slate-200 bg-slate-50/80 px-1.5 py-1">
      <a routerLink="/feed" routerLinkActive="bg-[#e7f3ff] text-[#1877f2] font-bold shadow-xs"
         class="flex items-center gap-2 rounded-xl px-3.5 py-1.5 text-xs sm:text-sm font-semibold text-slate-600 transition hover:text-slate-900">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span class="hidden sm:inline">Feed</span>
      </a>

      <a routerLink="/profile" routerLinkActive="bg-[#e7f3ff] text-[#1877f2] font-bold shadow-xs"
         class="flex items-center gap-2 rounded-xl px-3.5 py-1.5 text-xs sm:text-sm font-semibold text-slate-600 transition hover:text-slate-900">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span class="hidden sm:inline">Profile</span>
      </a>

      <button type="button"
         class="flex items-center gap-2 rounded-xl px-3.5 py-1.5 text-xs sm:text-sm font-semibold text-slate-600 transition hover:text-slate-900">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        <span class="hidden sm:inline">Notifications</span>
      </button>
    </nav>

    <div class="relative">
      <button type="button" (click)="toggleDropdown()"
              class="flex items-center gap-2.5 rounded-full border border-slate-200 bg-white px-2 py-1 shadow-xs transition hover:bg-slate-50">
        <img [src]="authService.currentUser()?.photo || 'https://route-posts.routemisr.com/route.png'"
             [alt]="authService.currentUser()?.name || 'User'"
             class="h-8 w-8 rounded-full object-cover border border-slate-200"
             (error)="$any($event.target).src = 'route.png'" />
        <span class="hidden max-w-[130px] truncate text-xs sm:text-sm font-bold text-slate-800 md:block">
          {{ authService.currentUser()?.username || authService.currentUser()?.name || 'Account' }}
        </span>
        <svg class="h-4 w-4 text-slate-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>

      @if (dropdownOpen()) {
        <div class="absolute right-0 z-50 mt-2 w-56 rounded-2xl border border-slate-200 bg-white p-2 shadow-xl animate-in fade-in zoom-in-95 duration-100">
          <div class="px-3 py-2 border-b border-slate-100 mb-1">
            <p class="text-sm font-bold text-slate-900 truncate">{{ authService.currentUser()?.name }}</p>
            <p class="text-xs text-slate-500 truncate">{{ authService.currentUser()?.email }}</p>
          </div>

          <a routerLink="/profile" (click)="closeDropdown()"
             class="flex w-full items-center gap-2.5 rounded-xl px-3 py-2 text-xs sm:text-sm font-semibold text-slate-700 transition hover:bg-slate-100">
            <svg class="h-4 w-4 text-slate-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            My Profile
          </a>

          <a routerLink="/settings" (click)="closeDropdown()"
             class="flex w-full items-center gap-2.5 rounded-xl px-3 py-2 text-xs sm:text-sm font-semibold text-slate-700 transition hover:bg-slate-100">
            <svg class="h-4 w-4 text-slate-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            Change Password
          </a>

          <div class="my-1 border-t border-slate-100"></div>

          <button type="button" (click)="logout()"
                  class="flex w-full items-center gap-2.5 rounded-xl px-3 py-2 text-xs sm:text-sm font-semibold text-rose-600 transition hover:bg-rose-50">
            <svg class="h-4 w-4 text-rose-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            Logout
          </button>
        </div>
      }
    </div>
  </div>
</header>
