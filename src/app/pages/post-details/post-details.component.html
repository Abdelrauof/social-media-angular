<div class="mx-auto max-w-2xl py-4 sm:py-6">
  <div class="mb-4">
    <a routerLink="/feed"
       class="inline-flex items-center gap-2 rounded-xl border border-slate-200 bg-white px-3.5 py-2 text-xs font-bold text-slate-700 shadow-xs hover:bg-slate-50 transition">
      <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="m15 18-6-6 6-6"/>
      </svg>
      <span>Back to Feed</span>
    </a>
  </div>

  @if (isLoading()) {
    <div class="py-16 text-center">
      <svg class="mx-auto h-8 w-8 animate-spin text-[#1877f2]" viewBox="0 0 24 24" fill="none">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
      <p class="mt-3 text-sm font-medium text-slate-500">Loading post details...</p>
    </div>
  } @else if (errorMessage() || !post()) {
    <div class="rounded-2xl border border-slate-200 bg-white p-8 text-center shadow-xs">
      <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-full bg-rose-50 text-rose-500">
        <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
      </div>
      <h3 class="mt-3 text-base font-bold text-slate-800">Post Unavailable</h3>
      <p class="mt-1 text-xs text-slate-500">{{ errorMessage() }}</p>
      <a routerLink="/feed"
         class="mt-4 inline-block rounded-xl bg-[#00298d] px-4 py-2 text-xs font-bold text-white hover:bg-[#001f6b] transition">
        Return to Feed
      </a>
    </div>
  } @else {
    <app-post-card [post]="post()!" [isDetailView]="true" (postUpdated)="onPostUpdated($event)"></app-post-card>
    <app-comment-section [postId]="post()!._id"></app-comment-section>
  }
</div>
